name: zz-wifcheck
on:
  push:
    branches: ["tmp-wifcheck-*"]
permissions:
  id-token: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/861433193200/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-forgecrux@probestack-prod.iam.gserviceaccount.com
          token_format: access_token
      - name: probe
        env:
          T: ${{ steps.auth.outputs.access_token }}
        run: |
          H() { curl -s -H "Authorization: Bearer ${T}" "$1" | head -c 2500; echo; }
          P() { curl -s -X POST -H "Authorization: Bearer ${T}" -H "Content-Type: application/json" -d "$2" "$1" | head -c 2500; echo; }
          echo "== artifactregistry"; H "https://artifactregistry.googleapis.com/v1/projects/861433193200/locations/-/repositories"
          echo "== run services"; H "https://run.googleapis.com/v2/projects/861433193200/locations/-/services?pageSize=20"
          echo "== cloudbuild"; H "https://cloudbuild.googleapis.com/v1/projects/861433193200/builds?pageSize=5"
          echo "== cloudsql"; H "https://sqladmin.googleapis.com/sql/v1beta4/projects/861433193200/instances"
          echo "== gke"; H "https://container.googleapis.com/v1/projects/861433193200/locations/-/clusters"
          echo "== compute"; H "https://compute.googleapis.com/compute/v1/projects/861433193200/zones/-/instances?maxResults=10"
          echo "== testPerms each SA"
          for sa in github-actions-forgecrux github-actions-deployer admin-backend-sa forgesphere-gcs-admin k8s-node-sa specforge-sa ps-marketing-content-sa log-reader; do
            echo "-- $sa"
            P "https://iam.googleapis.com/v1/projects/861433193200/serviceAccounts/$sa@probestack-prod.iam.gserviceaccount.com:testIamPermissions" '{"permissions":["iam.serviceAccounts.getAccessToken","iam.serviceAccounts.actAs","iam.serviceAccounts.signJwt","iam.serviceAccounts.get"]}'
          done
